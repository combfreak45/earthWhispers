[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthwhisper"
version = "1.0.0"
description = "Give the Earth a Voice: Flood Risk Intelligence MVP for Google Cloud AI Builder Cup 2026"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "EarthWhisper Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "google-cloud-aiplatform>=1.54.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-storage>=2.17.0",
    "google-genai>=0.1.1",
    "earthengine-api>=0.1.400",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "streamlit>=1.35.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.20.0",
    "pydeck>=0.9.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.32.0",
    "python-dateutil>=2.9.0",
    "joblib>=1.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_pipeline*", "ml_engine*", "agent*", "dashboard*", "evals*"]
